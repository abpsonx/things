services:
  db:
    image: postgres:15-alpine
    container_name: things-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thingsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password_db_mas}
      POSTGRES_DB: ${POSTGRES_DB:-thingsapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    container_name: things-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: things-backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thingsapp}:${POSTGRES_PASSWORD:-password_db_mas}@things-db:5432/${POSTGRES_DB:-thingsapp}
      REDIS_URL: redis://things-redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      FRONTEND_URL: https://dothings.id
      BACKEND_URL: https://dothings.id/api
      REGISTRATION_CODE: ${REGISTRATION_CODE:-THINGS-INTERNAL}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: 
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://dothings.id/api
        NEXT_PUBLIC_SOCKET_URL: https://dothings.id
        NEXT_PUBLIC_GIPHY_API_KEY: ${NEXT_PUBLIC_GIPHY_API_KEY:-}
    container_name: things-frontend
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: things-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./backend/uploads:/app/uploads:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
