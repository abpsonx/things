server {
    listen 80;
    server_name dothings.id www.dothings.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dothings.id www.dothings.id;

    ssl_certificate /etc/letsencrypt/live/dothings.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dothings.id/privkey.pem;

    client_max_body_size 10M;

    # Frontend
    location / {
        proxy_pass http://things-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api {
        proxy_pass http://things-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSockets
    location /socket.io {
        proxy_pass http://things-backend:8000/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploaded Files
    location /uploads {
        proxy_pass http://things-backend:8000/uploads;
        proxy_set_header Host $host;
    }
}
